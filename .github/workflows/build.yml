
name: Build Lennart Website for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Code herunterladen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PyInstaller installieren
        run: python -m pip install pyinstaller

      - name: Windows EXE erstellen
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name Lennart-Website Lennart-Website.py

      - name: EXE zum Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Lennart-Website-Windows
          path: dist/Lennart-Website.exe
